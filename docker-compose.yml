services:
  linkdrop:
    build: .
    container_name: linkdrop
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - linkdrop-downloads:/data/downloads
    environment:
      MAX_CONCURRENT_DOWNLOADS: "2"
      MAX_BATCH: "8"
      DOWNLOAD_TTL_SECONDS: "86400"

volumes:
  linkdrop-downloads:
